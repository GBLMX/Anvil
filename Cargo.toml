[workspace]
members = [
    "crates/anvil-api",
    "crates/anvil-control",
    "crates/anvil-core",
    "crates/anvil-ctl",
    "crates/anvil-distro-standard",
    "crates/anvil-editor",
    "crates/anvil-ipc",
    "crates/anvil-mcp",
    "crates/anvil-mod-git",
    "crates/anvil-module",
    "crates/anvil-mod-workspace-index",
    "crates/anvil-plugin-host",
    "crates/anvil-session",
    "crates/anvil-tui",
    "examples/anvil-distro-minimal",
]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/GBLMX/Anvil"

[workspace.dependencies]

[profile.release]
codegen-units = 1
lto = "fat"
strip = "symbols"
