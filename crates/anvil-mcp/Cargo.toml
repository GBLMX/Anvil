[package]
name = "anvil-mcp"
description = "Thin MCP stdio adapter over the Anvil control socket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anvil-control = { path = "../anvil-control", version = "0.6.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "anvil-mcp"
path = "src/main.rs"
