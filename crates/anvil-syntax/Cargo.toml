[package]
name = "anvil-syntax"
description = "Tree-sitter syntax highlighting and scope extraction for Anvil"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
latex = ["dep:codebook-tree-sitter-latex"]
typst = ["dep:codebook-tree-sitter-typst"]
lua = ["dep:tree-sitter-lua"]
web = ["dep:tree-sitter-typescript", "dep:tree-sitter-javascript", "dep:tree-sitter-css"]
c-family = ["dep:tree-sitter-c", "dep:tree-sitter-cpp"]

[dependencies]
anvil-core = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-json = { workspace = true }
tree-sitter-html = { workspace = true }
codebook-tree-sitter-latex = { workspace = true, optional = true }
codebook-tree-sitter-typst = { workspace = true, optional = true }
tree-sitter-typescript = { workspace = true, optional = true }
tree-sitter-javascript = { workspace = true, optional = true }
tree-sitter-css = { workspace = true, optional = true }
tree-sitter-c = { workspace = true, optional = true }
tree-sitter-cpp = { workspace = true, optional = true }
tree-sitter-lua = { workspace = true, optional = true }
tree-sitter-rust = { workspace = true }
tree-sitter-go = { workspace = true }
tree-sitter-bash = { workspace = true }
tree-sitter-python = { workspace = true }
tree-sitter-toml-ng = { workspace = true }
tree-sitter-yaml = { workspace = true }
tree-sitter-make = { workspace = true }
tree-sitter-dockerfile-updated = { workspace = true }
tree-sitter-md = { workspace = true }
tree-sitter-fish = { workspace = true }
