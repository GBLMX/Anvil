[package]
name = "anvil-syntax"
description = "Tree-sitter syntax highlighting and scope extraction for Anvil"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
latex = ["dep:codebook-tree-sitter-latex"]
typst = ["dep:codebook-tree-sitter-typst"]
web = ["dep:tree-sitter-typescript", "dep:tree-sitter-javascript", "dep:tree-sitter-css"]
c-family = ["dep:tree-sitter-c", "dep:tree-sitter-cpp"]

[dependencies]
anvil-core = { path = "../anvil-core", version = "0.7.0" }
tree-sitter = "0.26"
tree-sitter-json = "0.24"
tree-sitter-html = "0.23"
codebook-tree-sitter-latex = { version = "0.6", optional = true }
codebook-tree-sitter-typst = { version = "0.12", optional = true }
tree-sitter-typescript = { version = "0.23.2", optional = true }
tree-sitter-javascript = { version = "0.25.0", optional = true }
tree-sitter-css = { version = "0.25.0", optional = true }
tree-sitter-c = { version = "0.24.2", optional = true }
tree-sitter-cpp = { version = "0.23.4", optional = true }
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-python = "0.25"
tree-sitter-toml-ng = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-make = "1.1"
tree-sitter-dockerfile-updated = "0.2"
tree-sitter-md = "0.5"
tree-sitter-fish = "3.6.0"
