[package]
name = "anvil-plugin-host"
description = "Empty, sandboxed plugin-host process for Anvil"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]

[target.'cfg(target_os = "linux")'.dependencies]
anvil-ipc = { path = "../anvil-ipc", version = "0.6.0" }
serde = { version = "1", features = ["derive"] }
libc = "0.2"
serde_json = "1"
mlua = { version = "0.12", features = ["luau", "vendored"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
anvil-editor = { path = "../anvil-editor", version = "0.6.0" }
anvil-core = { path = "../anvil-core", version = "0.6.0" }
anvil-api = { path = "../anvil-api", version = "0.6.0" }

[[bin]]
name = "anvil-plugin-host"
path = "src/main.rs"

[[bin]]
name = "anvil-orphan-editor"
path = "src/bin/orphan-editor.rs"
