[package]
name = "anvil-plugin-host"
description = "Empty, sandboxed plugin-host process for Anvil"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]

[target.'cfg(target_os = "linux")'.dependencies]
anvil-ipc = { path = "../anvil-ipc", version = "0.4.0" }
libc = "0.2"
serde_json = "1"
mlua = { version = "0.12", features = ["luau", "vendored"] }

[[bin]]
name = "anvil-plugin-host"
path = "src/main.rs"

[[bin]]
name = "anvil-orphan-editor"
path = "src/bin/orphan-editor.rs"
