[package]
name = "anvil-plugin-host"
description = "Sandboxed Luau plugin-host process for Anvil"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]

[target.'cfg(target_os = "linux")'.dependencies]
anvil-ipc = { workspace = true }
serde = { workspace = true }
libc = { workspace = true }
serde_json = { workspace = true }
mlua = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
anvil-editor = { workspace = true }
anvil-core = { workspace = true }
anvil-api = { workspace = true }

[[bin]]
name = "anvil-plugin-host"
path = "src/main.rs"

[[bin]]
name = "anvil-orphan-editor"
path = "src/bin/orphan-editor.rs"
