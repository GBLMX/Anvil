[package]
name = "anvil-api"
description = "Public plugin API types for Anvil"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
bindings = ["dep:schemars", "dep:ts-rs"]

[dependencies]
schemars = { version = "1", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"] }
ts-rs = { version = "12", optional = true }

[dev-dependencies]
serde_json = "1"

[[example]]
name = "export_bindings"
required-features = ["bindings"]
