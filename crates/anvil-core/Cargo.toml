[package]
name = "anvil-core"
description = "Text buffer primitives and Phase 0 text-model benchmark for Anvil"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ropey = "1"
unicode-segmentation = "1"
unicode-width = "0.2"
[dev-dependencies]
criterion = "0.8"
proptest = "1"

[[bench]]
name = "text_model"
harness = false

[[bench]]
name = "line_index"
harness = false
