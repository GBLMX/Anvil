[package]
name = "anvil-distro-standard"
description = "Standard Anvil distribution composition and command-line entrypoint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["official-git"]
official-git = ["anvil-tui/official-git", "dep:anvil-mod-git"]
official-workspace-index = ["anvil-tui/official-workspace-index", "dep:anvil-mod-workspace-index"]
official-desktop = ["dep:anvil-mod-desktop"]
official-language-latex = ["anvil-tui/official-language-latex", "dep:anvil-mod-language-latex"]
official-language-typst = ["anvil-tui/official-language-typst", "dep:anvil-mod-language-typst"]
official-language-lua = ["anvil-tui/official-language-lua"]
official-language-web = ["anvil-tui/official-language-web"]
official-language-c-family = ["anvil-tui/official-language-c-family"]
language-pack-rust = ["anvil-tui/language-pack-rust"]
language-pack-typescript = ["anvil-tui/language-pack-typescript"]
language-pack-lua = ["anvil-tui/language-pack-lua"]
language-pack-c-family = ["anvil-tui/language-pack-c-family"]
full = [
    "official-git",
    "official-workspace-index",
    "official-desktop",
    "official-language-latex",
    "official-language-typst",
    "official-language-lua",
    "official-language-web",
    "official-language-c-family",
    "language-pack-rust",
    "language-pack-typescript",
    "language-pack-lua",
    "language-pack-c-family",
]

[dependencies]
anvil-tui = { workspace = true, default-features = false }
anvil-lsp-client = { workspace = true }
anvil-process = { workspace = true }
anvil-control = { workspace = true }
anvil-module = { workspace = true }
anvil-mod-git = { workspace = true, optional = true }
anvil-mod-workspace-index = { workspace = true, optional = true }
anvil-mod-desktop = { workspace = true, optional = true }
anvil-mod-language-latex = { workspace = true, optional = true }
anvil-mod-language-typst = { workspace = true, optional = true }
libc = { workspace = true }
serde_json = { workspace = true }
rustix = { workspace = true, features = ["fs"] }

[dev-dependencies]
tempfile = { workspace = true }

[[bin]]
name = "anvil"
path = "src/main.rs"
