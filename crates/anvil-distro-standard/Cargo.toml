[package]
name = "anvil-distro-standard"
description = "Standard Anvil distribution composition and command-line entrypoint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["official-git"]
official-git = ["anvil-tui/official-git", "dep:anvil-mod-git"]

[dependencies]
anvil-tui = { path = "../anvil-tui", version = "0.6.0", default-features = false }
anvil-control = { path = "../anvil-control", version = "0.6.0" }
anvil-module = { path = "../anvil-module", version = "0.6.0" }
anvil-mod-git = { path = "../anvil-mod-git", version = "0.6.0", optional = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "anvil"
path = "src/main.rs"
