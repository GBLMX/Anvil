[package]
name = "anvil-workspace"
description = "Workspace file worker, search, preview, and formatting services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["official-git"]
official-git = ["dep:anvil-mod-git"]

[dependencies]
anvil-ipc = { path = "../anvil-ipc", version = "0.6.0" }
anvil-module = { path = "../anvil-module", version = "0.6.0" }
anvil-task = { path = "../anvil-task", version = "0.6.0" }
anvil-mod-git = { path = "../anvil-mod-git", version = "0.6.0", optional = true }
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
