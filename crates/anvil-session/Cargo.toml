[package]
name = "anvil-session"
description = "Frontend-neutral document session for Anvil"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anvil-api = { path = "../anvil-api", version = "0.4.5" }
anvil-core = { path = "../anvil-core", version = "0.4.5" }
anvil-editor = { path = "../anvil-editor", version = "0.4.5" }
anvil-ipc = { path = "../anvil-ipc", version = "0.4.5" }
anvil-plugin-host = { path = "../anvil-plugin-host", version = "0.4.5" }
sha2 = "0.10"
serde_json = "1"

[dev-dependencies]
nix = { version = "0.31", features = ["poll", "process", "signal", "term"] }
