[package]
name = "anvil-session"
description = "Frontend-neutral document session for Anvil"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anvil-api = { workspace = true }
anvil-core = { workspace = true }
anvil-editor = { workspace = true }
anvil-ipc = { workspace = true }
getrandom = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
serde_json = { workspace = true }
unicode-segmentation = { workspace = true }

[dev-dependencies]
anvil-plugin-host = { workspace = true }
nix = { workspace = true, features = ["poll", "process", "signal", "term"] }
