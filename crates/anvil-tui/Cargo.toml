[package]
name = "anvil-tui"
description = "Minimal ratatui frontend for Anvil"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["official-git"]
official-git = ["dep:anvil-mod-git"]
official-workspace-index = ["dep:anvil-mod-workspace-index"]
official-language-latex = ["anvil-syntax/latex"]
official-language-typst = ["anvil-syntax/typst"]
e2e-bench = []

[dependencies]
anvil-api = { path = "../anvil-api", version = "0.6.0" }
anvil-core = { path = "../anvil-core", version = "0.6.0" }
anvil-editor = { path = "../anvil-editor", version = "0.6.0" }
anvil-ipc = { path = "../anvil-ipc", version = "0.6.0" }
anvil-lsp-client = { path = "../anvil-lsp-client", version = "0.6.0" }
anvil-control = { path = "../anvil-control", version = "0.6.0" }
anvil-mod-git = { path = "../anvil-mod-git", version = "0.6.0", optional = true }
anvil-mod-workspace-index = { path = "../anvil-mod-workspace-index", version = "0.6.0", optional = true }
anvil-module = { path = "../anvil-module", version = "0.6.0" }
anvil-plugin-host = { path = "../anvil-plugin-host", version = "0.6.0" }
anvil-platform = { path = "../anvil-platform", version = "0.6.0" }
anvil-process = { path = "../anvil-process", version = "0.6.0" }
anvil-session = { path = "../anvil-session", version = "0.6.0" }
anvil-task = { path = "../anvil-task", version = "0.6.0" }
anvil-workspace = { path = "../anvil-workspace", version = "0.6.0", default-features = false }
anvil-tui-kit = { path = "../anvil-tui-kit", version = "0.6.0" }
anvil-tui-theme = { path = "../anvil-tui-theme", version = "0.6.0" }
anvil-syntax = { path = "../anvil-syntax", version = "0.6.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = { version = "0.25", features = ["serde"] }
sha2 = "0.11"
crossterm = "0.29"
ratatui = "0.30"
unicode-width = "0.2"
regex = "1"
unicode-segmentation = "1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["poll", "process", "signal", "term"] }

[dev-dependencies]
nix = { version = "0.31", features = ["poll", "process", "signal", "term"] }
tempfile = "3"

[[bench]]
name = "e2e_edit"
harness = false
required-features = ["e2e-bench"]
