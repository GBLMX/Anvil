[package]
name = "anvil-tui"
description = "Minimal ratatui frontend for Anvil"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
e2e-bench = []

[dependencies]
tree-sitter = "0.25"
tree-sitter-json = "0.24"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-python = "0.25"
tree-sitter-toml-ng = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-make = "1.1"
tree-sitter-dockerfile-updated = "0.2"
tree-sitter-md = "0.5"
anvil-api = { path = "../anvil-api", version = "0.4.5" }
anvil-core = { path = "../anvil-core", version = "0.4.5" }
anvil-editor = { path = "../anvil-editor", version = "0.4.5" }
anvil-ipc = { path = "../anvil-ipc", version = "0.4.5" }
anvil-plugin-host = { path = "../anvil-plugin-host", version = "0.4.5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
crossterm = "0.29"
ratatui = "0.30"
unicode-width = "0.2"

[[bin]]
name = "anvil"
path = "src/main.rs"

[dev-dependencies]
nix = { version = "0.31", features = ["poll", "process", "signal", "term"] }
tempfile = "3"

[[bench]]
name = "e2e_edit"
harness = false
required-features = ["e2e-bench"]
