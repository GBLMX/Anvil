[package]
name = "anvil-tui"
description = "Minimal ratatui frontend for Anvil"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["official-git"]
official-git = ["dep:anvil-mod-git"]
e2e-bench = []

[dependencies]
tree-sitter = "0.26"
tree-sitter-json = "0.24"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-python = "0.25"
tree-sitter-toml-ng = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-make = "1.1"
tree-sitter-dockerfile-updated = "0.2"
tree-sitter-md = "0.5"
anvil-api = { path = "../anvil-api", version = "0.6.0" }
anvil-core = { path = "../anvil-core", version = "0.6.0" }
anvil-editor = { path = "../anvil-editor", version = "0.6.0" }
anvil-ipc = { path = "../anvil-ipc", version = "0.6.0" }
anvil-control = { path = "../anvil-control", version = "0.6.0" }
anvil-mod-git = { path = "../anvil-mod-git", version = "0.6.0", optional = true }
anvil-module = { path = "../anvil-module", version = "0.6.0" }
anvil-plugin-host = { path = "../anvil-plugin-host", version = "0.6.0" }
anvil-session = { path = "../anvil-session", version = "0.6.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = { version = "0.25", features = ["serde"] }
sha2 = "0.11"
crossterm = "0.29"
ratatui = "0.30"
unicode-width = "0.2"
regex = "1"
unicode-segmentation = "1"
tree-sitter-fish = "3.6.0"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["poll", "process", "signal", "term"] }

[dev-dependencies]
nix = { version = "0.31", features = ["poll", "process", "signal", "term"] }
tempfile = "3"

[[bench]]
name = "e2e_edit"
harness = false
required-features = ["e2e-bench"]
