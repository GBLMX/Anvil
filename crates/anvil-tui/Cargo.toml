[package]
name = "anvil-tui"
description = "Minimal ratatui frontend for Anvil"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["official-git"]
official-git = ["dep:anvil-mod-git"]
official-language-latex = ["anvil-syntax/latex"]
official-language-typst = ["anvil-syntax/typst"]
official-language-lua = ["anvil-syntax/lua"]
official-language-web = ["anvil-syntax/web"]
official-language-haskell = ["anvil-syntax/haskell"]
official-language-c-family = ["anvil-syntax/c-family"]
language-pack-rust = []
language-pack-typescript = ["official-language-web"]
language-pack-lua = ["official-language-lua"]
language-pack-haskell = ["official-language-haskell"]
language-pack-c-family = ["official-language-c-family"]
e2e-bench = []

[dependencies]
anvil-api = { workspace = true }
anvil-core = { workspace = true }
anvil-editor = { workspace = true }
anvil-ipc = { workspace = true }
anvil-lsp-client = { workspace = true }
anvil-control = { workspace = true }
anvil-dap = { workspace = true }
anvil-mod-git = { workspace = true, optional = true }
anvil-module = { workspace = true }
anvil-plugin-host = { workspace = true }
anvil-platform = { workspace = true }
anvil-process = { workspace = true }
anvil-runtime = { workspace = true }
anvil-session = { workspace = true }
anvil-task = { workspace = true }
anvil-workspace = { workspace = true }
anvil-tui-kit = { workspace = true }
anvil-tui-theme = { workspace = true }
anvil-syntax = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml_edit = { workspace = true }
sha2 = { workspace = true }
crossterm = { workspace = true }
ratatui = { workspace = true }
unicode-width = { workspace = true }
regex = { workspace = true }
unicode-segmentation = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["poll", "process", "signal", "term"] }

[dev-dependencies]
nix = { workspace = true, features = ["poll", "process", "signal", "term"] }
tempfile = { workspace = true }

[[bench]]
name = "e2e_edit"
harness = false
required-features = ["e2e-bench"]
