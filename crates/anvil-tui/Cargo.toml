[package]
name = "anvil-tui"
description = "Minimal ratatui frontend for Anvil"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
e2e-bench = []

[dependencies]
anvil-api = { path = "../anvil-api", version = "0.1.0" }
anvil-core = { path = "../anvil-core", version = "0.1.0" }
anvil-editor = { path = "../anvil-editor", version = "0.1.0" }
anvil-ipc = { path = "../anvil-ipc", version = "0.1.0" }
sha2 = "0.10"
crossterm = "0.29"
ratatui = "0.30"

[[bin]]
name = "anvil"
path = "src/main.rs"

[dev-dependencies]
nix = { version = "0.31", features = ["poll", "process", "signal", "term"] }
tempfile = "3"

[[bench]]
name = "e2e_edit"
harness = false
required-features = ["e2e-bench"]
