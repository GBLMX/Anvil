name: Release build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check release checklist
        run: scripts/release-checklist.sh "$GITHUB_REF_NAME"

      - name: Build test layout
        run: |
          umask 077
          openssl genpkey -algorithm ED25519 -out "$RUNNER_TEMP/test-plugin.pem"
          ANVIL_PLUGIN_SIGNING_KEY="$RUNNER_TEMP/test-plugin.pem" \
            scripts/release-layout.sh "$RUNNER_TEMP/layout"

      - name: Verify shipped installer
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/verify-data
          LANG: C.UTF-8
        run: |
          test -x "$RUNNER_TEMP/layout/install.sh"
          "$RUNNER_TEMP/layout/install.sh" "$RUNNER_TEMP/verify-prefix"
          test -x "$RUNNER_TEMP/verify-prefix/bin/anvil"
          grep -q '"source": "official"' \
            "$RUNNER_TEMP/verify-data/anvil/plugins/state.json"
          "$RUNNER_TEMP/verify-prefix/bin/anvil" doctor --profile installed --json \
            > "$RUNNER_TEMP/doctor.json"
          python3 - "$RUNNER_TEMP/doctor.json" <<'PY'
          import json
          import sys

          report = json.load(open(sys.argv[1], encoding="utf-8"))
          assert report["schema_version"] == 1, report
          assert report["profile"] == "installed", report
          assert report["ok"] is True, report
          print("anvil doctor installed profile: ok")
          PY

      - name: Verify install, upgrade, and uninstall lifecycle
        run: scripts/release-lifecycle-smoke.sh "$RUNNER_TEMP/layout"

      - uses: anchore/sbom-action/download-syft@v0
      - name: Prepare unsigned build inputs
        run: |
          version="${GITHUB_REF_NAME#v}"
          rm -rf "$RUNNER_TEMP/layout/share/anvil/packages"
          syft "$RUNNER_TEMP/layout" \
            -o "spdx-json=$RUNNER_TEMP/anvil-$version.sbom.spdx.json"
          tar \
            --sort=name \
            --mtime='@0' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf "$RUNNER_TEMP/anvil-$version-linux-x86_64-inputs.tar.gz" \
            -C "$RUNNER_TEMP/layout" .
          cd "$RUNNER_TEMP"
          sha256sum \
            "anvil-$version-linux-x86_64-inputs.tar.gz" \
            "anvil-$version.sbom.spdx.json" \
            > "anvil-$version-inputs.sha256"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/anvil-*-linux-x86_64-inputs.tar.gz

      - name: Upload unsigned build inputs
        uses: actions/upload-artifact@v7
        with:
          name: anvil-${{ github.ref_name }}-build-inputs
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/anvil-*-linux-x86_64-inputs.tar.gz
            ${{ runner.temp }}/anvil-*.sbom.spdx.json
            ${{ runner.temp }}/anvil-*-inputs.sha256
