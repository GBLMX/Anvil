name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check relative Markdown links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path('.')
          missing = []
          for path in sorted(root.rglob('*.md')):
              for match in re.finditer(r'\[[^\]]*\]\(([^)]+)\)', path.read_text()):
                  target = match.group(1).split('#', 1)[0]
                  if not target or '://' in target or target.startswith('mailto:'):
                      continue
                  if not (path.parent / target).resolve().exists():
                      missing.append(f'{path}: {target}')
          if missing:
              print('\n'.join(missing))
              sys.exit(1)
          print('Markdown links: ok')
          PY

  bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Type-check generated TypeScript
        run: |
          npm install --global typescript@5.9.3
          tsc --noEmit --skipLibCheck crates/anvil-api/bindings/*.ts

  bench-regression:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Measure PR p99
        run: |
          TEXT_P99_MB=10 TEXT_P99_SAMPLES=100 \
            cargo run --release -p anvil-core --bin text-p99 > /tmp/pr-p99.csv
      - name: Measure main p99
        run: |
          git worktree add --detach /tmp/bench-base origin/main
          cd /tmp/bench-base
          CARGO_TARGET_DIR=/tmp/bench-target \
            TEXT_P99_MB=10 TEXT_P99_SAMPLES=100 \
            cargo run --release -p anvil-core --bin text-p99 > /tmp/base-p99.csv
      - name: Compare p99 against main
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          def read(path):
              rows = {}
              for line in Path(path).read_text().splitlines():
                  if not line or line.startswith("backend,"):
                      continue
                  backend, mb, workload, _p50, _p95, p99, _samples = line.split(",")
                  rows[(backend, mb, workload)] = float(p99)
              return rows

          base = read("/tmp/base-p99.csv")
          current = read("/tmp/pr-p99.csv")
          failures = []
          for key, before in base.items():
              after = current.get(key)
              if after is None:
                  failures.append(f"{key}: missing from PR run")
                  continue
              if before < 10_000:
                  print(f"{key}: skipped (p99 < 10us)")
                  continue
              ratio = after / before if before else float("inf")
              print(f"{key}: {ratio:.3f}x")
              if ratio > 1.10:
                  failures.append(f"{key}: p99 regressed {ratio:.3f}x")
          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("p99 regression gate: ok")
          PY

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Detect Rust workspace
        id: detect
        run: |
          if [ -f Cargo.toml ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'No Cargo.toml yet; Rust checks will activate when the workspace lands.'
          fi
      - name: Check frozen version
        if: steps.detect.outputs.present == 'true'
        run: scripts/check-frozen-version.sh
      - name: Install pinned Rust toolchain
        if: steps.detect.outputs.present == 'true'
        run: rustup show
      - name: Check formatting
        if: steps.detect.outputs.present == 'true'
        run: cargo fmt --all -- --check
      - name: Lint
        if: steps.detect.outputs.present == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check TUI benchmark
        if: steps.detect.outputs.present == 'true'
        run: cargo clippy -p anvil-tui --all-targets --features e2e-bench -- -D warnings
      - name: Check module feature matrix
        if: steps.detect.outputs.present == 'true'
        run: |
          cargo test -p anvil-tui --no-default-features
          cargo test -p anvil-tui --features official-workspace-index
          cargo test -p anvil-tui --features official-language-latex
          cargo test -p anvil-tui --features official-language-typst
          cargo check -p anvil-tui --features official-git,official-workspace-index,official-language-latex,official-language-typst
          cargo test -p anvil-distro-standard --no-default-features
          cargo test -p anvil-distro-standard --features official-workspace-index
          cargo test -p anvil-distro-standard --features official-language-latex
          cargo test -p anvil-distro-standard --features official-language-typst
          cargo test -p anvil-distro-standard --features official-desktop
          cargo test -p anvil-distro-standard --all-features
          cargo run -q -p anvil-distro-minimal -- --version | grep -q '^anvil-minimal '
          for package in anvil-mod-git anvil-mod-workspace-index anvil-mod-desktop anvil-mod-language-latex anvil-mod-language-typst; do
            if cargo tree -p "$package" -e normal --prefix none | grep -q '^anvil-tui '; then
              echo "$package depends on anvil-tui" >&2
              exit 1
            fi
          done
          for package in anvil-api anvil-core anvil-editor anvil-ipc anvil-platform anvil-session anvil-module anvil-plugin-host; do
            if cargo tree -p "$package" -e normal --prefix none | grep -q '^anvil-tui '; then
              echo "kernel package $package depends on anvil-tui" >&2
              exit 1
            fi
          done
      - name: Test
        if: steps.detect.outputs.present == 'true'
        run: cargo test --workspace --all-targets
      - name: Check generated API bindings
        if: steps.detect.outputs.present == 'true'
        run: |
          cargo run -p anvil-api --example export_bindings
          git diff --exit-code -- crates/anvil-api/bindings
      - name: Check dependency licenses and advisories
        if: steps.detect.outputs.present == 'true'
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  control-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Build Rust control plane
        run: cargo build --release -p anvil-distro-standard -p anvil-ctl -p anvil-mcp
      - name: Build Go gateway
        run: |
          go build -trimpath -buildvcs=false -ldflags='-s -w' -o target/release/anvil-gateway ./go/cmd/anvil-gateway
          go build -trimpath -buildvcs=false -ldflags='-s -w' -o target/release/anvil-exec-runner ./go/cmd/anvil-exec-runner
      - name: Run real-TUI control smoke
        env:
          ANVIL_BIN: ${{ github.workspace }}/target/release/anvil
          ANVIL_CTL: ${{ github.workspace }}/target/release/anvil-ctl
          ANVIL_GATEWAY: ${{ github.workspace }}/target/release/anvil-gateway
        run: scripts/ctl-smoke.sh
      - name: Run MCP stdio smoke
        env:
          ANVIL_BIN: ${{ github.workspace }}/target/release/anvil
          ANVIL_CTL: ${{ github.workspace }}/target/release/anvil-ctl
          ANVIL_MCP: ${{ github.workspace }}/target/release/anvil-mcp
          ANVIL_GATEWAY: ${{ github.workspace }}/target/release/anvil-gateway
        run: scripts/mcp-smoke.sh

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Detect Go module
        id: detect
        run: |
          if [ -f go/go.mod ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
            echo 'file=go/go.mod' >> "$GITHUB_OUTPUT"
          elif [ -f go.mod ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
            echo 'file=go.mod' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'No Go module yet; Go checks will activate when the gateway lands.'
          fi
      - uses: actions/setup-go@v7
        if: steps.detect.outputs.present == 'true'
        with:
          go-version-file: ${{ steps.detect.outputs.file }}
          cache: true
      - name: Check formatting
        if: steps.detect.outputs.present == 'true'
        run: cd "$(dirname "${{ steps.detect.outputs.file }}")" && test -z "$(gofmt -l .)"
      - name: Vet
        if: steps.detect.outputs.present == 'true'
        run: cd "$(dirname "${{ steps.detect.outputs.file }}")" && go vet ./...
      - name: Test
        if: steps.detect.outputs.present == 'true'
        run: cd "$(dirname "${{ steps.detect.outputs.file }}")" && go test ./...
      - name: Lint
        if: steps.detect.outputs.present == 'true'
        run: |
          cd "$(dirname "${{ steps.detect.outputs.file }}")"
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          "$(go env GOPATH)/bin/golangci-lint" run ./...
      - name: Vulnerability scan
        if: steps.detect.outputs.present == 'true'
        run: |
          cd "$(dirname "${{ steps.detect.outputs.file }}")"
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Stress symlink race
        if: steps.detect.outputs.present == 'true'
        run: cd "$(dirname "${{ steps.detect.outputs.file }}")" && go test -run '^TestSymlinkSwapCannotEscape$' -count=100 ./go/internal/execrunner

  release-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Generate test plugin key
        run: openssl genpkey -algorithm ED25519 -out "$RUNNER_TEMP/plugin.pem"
      - name: Build signed release layout
        env:
          ANVIL_PLUGIN_SIGNING_KEY: ${{ runner.temp }}/plugin.pem
        run: scripts/release-layout.sh "$RUNNER_TEMP/anvil-layout"
      - name: Verify release layout
        run: |
          test -x "$RUNNER_TEMP/anvil-layout/bin/anvil"
          test -x "$RUNNER_TEMP/anvil-layout/bin/anvil-gateway"
          test -x "$RUNNER_TEMP/anvil-layout/install.sh"
          test -f "$RUNNER_TEMP/anvil-layout/share/anvil/official/plugins/trim-whitespace/plugin.json"
          test -f "$RUNNER_TEMP/anvil-layout/share/anvil/packages/official.pub"
      - name: Install layout twice
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/data
        run: |
          "$RUNNER_TEMP/anvil-layout/install.sh" "$RUNNER_TEMP/prefix"
          "$RUNNER_TEMP/anvil-layout/install.sh" "$RUNNER_TEMP/prefix"
      - name: Verify installed layout and bootstrap
        run: |
          test -x "$RUNNER_TEMP/prefix/bin/anvil"
          test -f "$RUNNER_TEMP/prefix/share/anvil/official/plugins/trim-whitespace/plugin.json"
          digest="$(sha256sum "$RUNNER_TEMP/anvil-layout/share/anvil/packages/"*.anvil-plugin | awk '{print $1}')"
          python3 - "$RUNNER_TEMP/data/anvil/plugins/state.json" "$digest" <<'PY'
          import json
          import sys

          state = json.load(open(sys.argv[1]))
          plugin = state["plugins"]["anvil.official.trim-whitespace"]
          assert plugin["source"] == "official", plugin
          assert plugin["enabled"] is False, plugin
          assert plugin["active_digest"] == sys.argv[2], plugin
          PY

  official-plugin-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build gateway
        run: go build -trimpath -buildvcs=false -ldflags='-s -w' -o "$RUNNER_TEMP/anvil-gateway" ./go/cmd/anvil-gateway
      - name: Package and sign official plugin
        run: |
          openssl genpkey -algorithm ED25519 -out "$RUNNER_TEMP/official.pem"
          scripts/package-official-plugin.sh \
            plugins/official/trim-whitespace \
            "$RUNNER_TEMP/official.pem" \
            "$RUNNER_TEMP/packages"
      - name: Install official packages twice
        run: |
          for _ in 1 2; do
            "$RUNNER_TEMP/anvil-gateway" \
              -install-bundled "$RUNNER_TEMP/packages" \
              -plugin-store "$RUNNER_TEMP/store" \
              -plugin-trust-store "$RUNNER_TEMP/trust.json"
          done
      - name: Verify official source
        run: |
          grep -q '"source": "official"' "$RUNNER_TEMP/store/state.json"
          find "$RUNNER_TEMP/store/store" -name package.anvil-plugin -print -quit | grep -q .
