name: Bug report
description: Report a reproducible defect in Anvil
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Use the private security
        advisory link from the issue chooser.

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `git rev-parse HEAD`, release tag, or build artifact.
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform
      description: OS, kernel, terminal, and Rust/Go versions when relevant.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: Minimal steps, file contents, and exact input sequence.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include logs, panic messages, or screenshots without secrets.
    validations:
      required: true

  - type: checkboxes
    id: security
    attributes:
      label: Security check
      options:
        - label: This is not a security vulnerability.
          required: true
